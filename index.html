<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Pages Deployment Test</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f6fa;
      color: #183b5b;
    }
    main {
      width: min(620px, 100%);
      box-sizing: border-box;
      padding: 36px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 28px rgba(24, 59, 91, 0.12);
      text-align: center;
    }
    .tag {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 999px;
      background: #e5f4e8;
      color: #176b35;
      font-size: 13px;
      font-weight: bold;
    }
    h1 { margin: 18px 0 12px; }
    p { line-height: 1.6; color: #46596b; }
    code {
      background: #eef2f7;
      padding: 3px 6px;
      border-radius: 5px;
    }
    footer { margin-top: 24px; font-size: 13px; color: #667788; }
  </style>
</head>
<body>
  <main>
    <span class="tag">TEST PAGE</span>
    <h1>GitHub Pages Deployment Test</h1>
    <p>If you can see this page online after committing and pushing this file, your automatic deployment is working.</p>
    <p>Test file: <code>index.html</code></p>
    <p>Next, check the repository's <strong>Actions</strong> tab for the deployment result.</p>
    <footer>Kazibwe Foundation School — temporary deployment test</footer>
  </main>
</body>
</html>
